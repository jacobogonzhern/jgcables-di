# Integración continua: se ejecuta en cada Pull Request y en cada push a develop y main.
# Si falla el lint, los tests o la compilación, el Pull Request no se puede fusionar.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm test -- --watch=false

      - name: Compilar para producción
        run: npm run build
