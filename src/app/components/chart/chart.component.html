<figure class="panel" style="margin: 0;">
  <figcaption><strong>{{ title }}</strong></figcaption>
  <div style="position: relative; height: 18rem;">
    <canvas #canvas role="img" [attr.aria-label]="title"></canvas>
  </div>
  <!-- Versión en texto para lectores de pantalla -->
  <ul class="sr-only">
    @for (label of labels; track label; let i = $index) {
      <li>{{ label }}: {{ values[i] }}</li>
    }
  </ul>
</figure>
