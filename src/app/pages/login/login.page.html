<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Portal JG Cables</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">
  <div style="max-width: 420px; margin: 40px auto 0;">
    <h1>Acceso al Sistema</h1>
    <p>Ingresa tus credenciales autorizadas</p>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <ion-item fill="outline" class="ion-margin-bottom">
        <ion-label position="floating">Correo Electrónico</ion-label>
        <ion-input type="email" formControlName="email"></ion-input>
      </ion-item>

      <ion-item fill="outline" class="ion-margin-bottom">
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input type="password" formControlName="password"></ion-input>
      </ion-item>

      <ion-button expand="block" type="submit" [disabled]="loginForm.invalid" class="ion-margin-top">
        Iniciar Sesión
      </ion-button>
    </form>

    <ion-button fill="clear" routerLink="/register" class="ion-margin-top">
      ¿Nuevo usuario? Registrarse aquí
    </ion-button>
  </div>
</ion-content>
