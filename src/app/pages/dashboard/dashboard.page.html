<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button aria-label="Abrir menú"></ion-menu-button>
    </ion-buttons>
    <ion-title>Dashboard</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="page-heading">
    <span class="etiqueta">Administración</span>
    <h1>Panel de control</h1>
    <p>Resumen de la actividad de JG Cables. Los datos se actualizan en tiempo real.</p>
  </div>

  <div class="page-body">

  @if (loading()) {
    <div class="loading-state" role="status">
      <ion-spinner name="crescent" aria-hidden="true"></ion-spinner>
      <span>Cargando datos...</span>
    </div>
  } @else if (loadError()) {
    <div role="alert">
      <p>{{ errorToastMessage() }}</p>
      <ion-button (click)="reintentarCarga()">Reintentar</ion-button>
    </div>
  } @else {
    <ion-select [(ngModel)]="filtroEstado" label="Filtrar por estado" labelPlacement="floating"
      fill="outline" interface="popover" class="filtro">
      <ion-select-option value="todos">Todos</ion-select-option>
      <ion-select-option value="pendiente">Pendiente</ion-select-option>
      <ion-select-option value="enviado">Enviado</ion-select-option>
      <ion-select-option value="entregado">Entregado</ion-select-option>
    </ion-select>

    <div class="metrics-grid">
      <app-metric-card title="Total de pedidos" [value]="totalPedidos()" icon="cart-outline"
        color="primary" (cardClick)="onMetricCardClick('pedidos')"></app-metric-card>
      <app-metric-card title="Total de clientes" [value]="totalClientes()" icon="people-outline"
        color="success" (cardClick)="onMetricCardClick('clientes')"></app-metric-card>
      <app-metric-card title="Ingresos" [value]="ingresos()" icon="cash-outline"
        color="tertiary" (cardClick)="onMetricCardClick('ingresos')"></app-metric-card>
      <app-metric-card title="Pedidos pendientes" [value]="pedidosPendientes()" icon="time-outline"
        color="warning" (cardClick)="onMetricCardClick('pendientes')"></app-metric-card>
    </div>

    <div class="charts-grid">
      <app-chart title="Pedidos por estado" type="doughnut" [labels]="estados"
        [values]="pedidosPorEstado()" (segmentClick)="filtrarPorEstado($event)"></app-chart>
      <app-chart title="Facturación por cliente (€)" type="bar"
        [labels]="facturacionPorCliente().labels" [values]="facturacionPorCliente().values"></app-chart>
    </div>
  }
  </div>
</ion-content>

<ion-toast
  [isOpen]="errorToastOpen()"
  [message]="errorToastMessage()"
  color="danger"
  duration="3500"
  (didDismiss)="errorToastOpen.set(false)"
></ion-toast>
