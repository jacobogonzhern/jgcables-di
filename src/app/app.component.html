<ion-app>
  <ion-split-pane contentId="main-content" when="md">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list id="navigation-list">
          <ion-list-header>
            <ion-icon name="hardware-chip-outline" slot="start" color="primary"></ion-icon>
            <ion-label>JG Cables - Gestión</ion-label>
          </ion-list-header>

          @if (auth.user$ | async; as user) {
            <ion-menu-toggle auto-hide="false">
              <ion-item routerLink="/pedidos" routerLinkActive="selected" lines="none">
                <ion-icon slot="start" name="receipt-outline"></ion-icon>
                <ion-label>Gestión de Pedidos</ion-label>
              </ion-item>
            </ion-menu-toggle>

            @if (user.rol === 'admin') {
              <ion-menu-toggle auto-hide="false">
                <ion-item routerLink="/dashboard" routerLinkActive="selected" lines="none">
                  <ion-icon slot="start" name="bar-chart-outline"></ion-icon>
                  <ion-label>Dashboard Analítico</ion-label>
                </ion-item>
              </ion-menu-toggle>

              <ion-menu-toggle auto-hide="false">
                <ion-item routerLink="/usuarios" routerLinkActive="selected" lines="none">
                  <ion-icon slot="start" name="people-outline"></ion-icon>
                  <ion-label>Usuarios del Sistema</ion-label>
                </ion-item>
              </ion-menu-toggle>
            }

            <ion-item button (click)="logout()" lines="none" class="ion-margin-top">
              <ion-icon slot="start" name="log-out-outline" color="danger"></ion-icon>
              <ion-label color="danger">Cerrar Sesión</ion-label>
            </ion-item>
          } @else {
            <ion-menu-toggle auto-hide="false">
              <ion-item routerLink="/login" routerLinkActive="selected" lines="none">
                <ion-icon slot="start" name="log-in-outline"></ion-icon>
                <ion-label>Iniciar Sesión</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
